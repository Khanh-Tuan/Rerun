# XcodeGen spec: on the Mac, run `xcodegen` in this folder to create Rerun.xcodeproj.
# See docs/ios-submit-guide.md for the full steps.
name: Rerun
options:
  bundleIdPrefix: com.example
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true

targets:
  Rerun:
    type: application
    platform: iOS
    sources:
      - path: Rerun
      - path: ../web          # the game; copied into the app as a "web" folder
        type: folder
        buildPhase: resources
    settings:
      base:
        PRODUCT_NAME: Rerun
        PRODUCT_BUNDLE_IDENTIFIER: com.example.rerun   # CHANGE to your own, e.g. com.yourname.rerun
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        TARGETED_DEVICE_FAMILY: "1"                    # iPhone only for the first release
        SWIFT_VERSION: "5.0"
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: ""                           # pick your team in Xcode > Signing & Capabilities
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Rerun
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.arcade-games
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIStatusBarHidden: YES
        INFOPLIST_KEY_UIRequiresFullScreen: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
