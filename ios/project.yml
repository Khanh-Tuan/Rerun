# XcodeGen spec: on the Mac, run `xcodegen` in this folder to create Afterlap.xcodeproj.
# See docs/ios-submit-guide.md for the full steps.
name: Afterlap
options:
  bundleIdPrefix: com.example
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true

targets:
  Afterlap:
    type: application
    platform: iOS
    sources:
      - path: Afterlap
      - path: ../web          # the game; copied into the app as a "web" folder
        type: folder
        buildPhase: resources
    settings:
      base:
        PRODUCT_NAME: Afterlap
        PRODUCT_BUNDLE_IDENTIFIER: com.newezvietnam.afterlap  # CHANGE to your own, e.g. com.yourname.afterlap
        MARKETING_VERSION: "1.1"
        CURRENT_PROJECT_VERSION: "2"
        TARGETED_DEVICE_FAMILY: "1.1"                    # iPhone only for the first release
        SWIFT_VERSION: "5.0"
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: ""                           # pick your team in Xcode > Signing & Capabilities
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Afterlap
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.arcade-games
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIStatusBarHidden: YES
        INFOPLIST_KEY_UIRequiresFullScreen: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
